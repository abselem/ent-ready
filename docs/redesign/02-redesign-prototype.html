<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENT Ready · концепция интерфейса</title>
<style>
:root{color-scheme:light;--bg:#f5f7fa;--card:#fff;--fg:#17243a;--muted:#52627a;--line:#d8e0ea;--control-border:#7b8ba0;--primary:#2454c6;--on:#fff;--soft:#edf3ff;--good:#17613d;--goodbg:#eaf6ef;--bad:#a42435;--badbg:#fdeef0} [data-theme=dark]{color-scheme:dark;--bg:#101827;--card:#192436;--fg:#f1f5fa;--muted:#b3c0d1;--line:#40516a;--control-border:#7a8da9;--primary:#a9c5ff;--on:#10203f;--soft:#233650;--good:#a6e5bc;--goodbg:#183b2d;--bad:#ffbac5;--badbg:#492733}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 Arial,sans-serif}button,input,select{font:inherit;color:inherit}button,a,input,select{min-height:44px}button,a{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:9px 15px;text-align:left}button:hover{border-color:var(--primary)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--primary);outline-offset:3px}button:disabled{opacity:.55;cursor:not-allowed}a{color:var(--primary);display:inline-flex;align-items:center;text-decoration:none}a:hover{text-decoration:underline}.primary{background:var(--primary);color:var(--on);border-color:var(--primary)}.toolbar{padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card);display:flex;flex-wrap:wrap;gap:12px;align-items:center}.toolbar small{max-width:340px}.toolbar label{font-size:13px;display:flex;gap:8px;align-items:center}.toolbar select{max-width:230px}.layout{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:calc(100vh - 90px)}aside{border-right:1px solid var(--line);padding:28px 16px;background:var(--card)}.brand{font-size:21px;font-weight:700;margin:0 12px 32px}.brand span{color:#26c0bd}nav{display:grid;gap:8px}nav button{border-color:transparent;background:transparent;font-size:14px}nav button.active{background:var(--soft);color:var(--primary);font-weight:bold}.role{margin:32px 12px;color:var(--muted);font-size:13px}main{width:100%;max-width:1184px;padding:36px 32px 64px;margin:auto}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:28px}h1{font-size:28px;line-height:1.25;margin:4px 0 10px;letter-spacing:-.6px}h2{font-size:20px;margin:0 0 16px}h3{font-size:17px;margin:0 0 6px}p{margin:0 0 12px}.muted,small{color:var(--muted)}small{font-size:13px}.eyebrow{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}.card{padding:24px;border:1px solid var(--line);background:var(--card);border-radius:16px;margin-bottom:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.subject{padding:20px;min-height:112px;display:grid;gap:10px}.symbol{color:var(--primary);background:var(--soft);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;font-weight:bold}.section{margin:32px 0 16px}.badge{padding:4px 9px;border-radius:6px;background:var(--soft);color:var(--primary);font-size:12px;display:inline-block}.tagline{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--muted);font-size:14px}.search{margin-bottom:16px;max-width:440px}label.field{display:grid;gap:6px;font-size:14px;margin-bottom:16px}input,select{background:var(--card);border:1px solid var(--control-border);border-radius:10px;padding:10px 12px;width:100%}.toolbar select{width:auto}.center{max-width:760px;margin:auto}.progress{height:6px;background:var(--line);border-radius:9px;margin:20px 0 28px}.progress span{display:block;width:40%;background:var(--primary);height:100%;border-radius:9px}.question{font-size:22px;line-height:1.5;margin:12px 0 24px}.answers{border:0;padding:0;margin:0}.answers legend{padding:0}.option{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--control-border);border-radius:10px;margin:10px 0;min-height:52px;cursor:pointer}.option:has(input:checked){background:var(--soft);border-color:var(--primary)}.option input{width:20px;min-height:20px;margin:0;accent-color:var(--primary)}.notice{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--soft);margin:16px 0}.good{color:var(--good);background:var(--goodbg)}.bad{color:var(--bad);background:var(--badbg)}.score{font-size:46px;font-weight:bold;letter-spacing:-2px;margin:12px 0 0}.mobile{display:none}.empty{text-align:center;padding:64px 24px}.empty h2{margin-bottom:8px}.skel{height:20px;width:70%;background:var(--line);border-radius:6px;margin:14px 0}.skel.short{width:40%}.state-note{font-size:12px;margin-top:32px;color:var(--muted)}.divider{border-top:1px solid var(--line);margin:20px 0}.form{max-width:680px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.testlist .card{padding:20px}.testlist h3{overflow-wrap:anywhere}.testlist .badge{margin-right:8px}.demo-label{font-weight:bold;font-size:13px}#feedback{margin:8px 0;color:var(--muted);font-size:14px}
@media(max-width:767px){.toolbar{padding:12px}.toolbar small{width:100%;max-width:none}.toolbar label{flex:1;min-width:140px}.toolbar select{max-width:100%;width:100%}.layout{display:block}aside{display:none}main{padding:24px 16px calc(100px + env(safe-area-inset-bottom))}.pagehead{flex-direction:column;margin-bottom:24px}h1{font-size:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.two{grid-template-columns:1fr}.card{padding:18px}.row{flex-wrap:wrap}.row.tight{flex-wrap:nowrap}.question{font-size:20px}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}.mobile button{flex:1;min-width:0;border:0;border-radius:0;padding:12px 2px;font-size:11px;text-align:center;min-height:56px}.mobile button.active{color:var(--primary);background:var(--soft)}.subject{padding:16px}.actions button{flex:1}.score{font-size:40px}}@media(max-width:340px){.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<div class="toolbar" aria-label="Инструменты ревью прототипа"><small><b class="demo-label">КОНЦЕПЦИЯ · ИСКУССТВЕННЫЕ ДАННЫЕ</b><br>Без сети и интеграции с продуктом.</small><label>Экран<select id="screen"><option value="home">Ученик · главная</option><option value="ent">Ученик · ЕНТ</option><option value="test">Прохождение теста</option><option value="result">Результат</option><option value="groups">Учитель · группы</option><option value="tests">Учитель · тесты</option></select></label><label>Состояние<select id="state"><option value="normal">Обычное</option><option value="loading">Загрузка</option><option value="empty">Нет данных</option><option value="error">Ошибка / повтор</option><option value="denied">Нет доступа</option><option value="pending">Сохранение</option><option value="expired">Время вышло</option><option value="saved">Сохранено</option><option value="locked">Разбор закрыт / нет профилей</option></select></label><button id="theme">Тёмная тема</button></div>
<div class="layout"><aside><div class="brand">✓ ENT <span>Ready</span></div><nav id="desktopnav" aria-label="Основная навигация"></nav><div class="role">Демо-профиль<br><b id="role">Ученик</b></div></aside><main id="main"></main></div><nav class="mobile" id="mobilenav" aria-label="Основная навигация на телефоне"></nav>
<script>
const screen=document.querySelector('#screen'),state=document.querySelector('#state'),main=document.querySelector('#main');let selected='B';
const data={home:['Мои тесты','Назначения учителя и самостоятельная тренировка'],ent:['Пробный ЕНТ','Проверьте профильные предметы перед стартом'],test:['Квадратные уравнения','Обычный тест · демонстрация'],result:['Результат теста','Квадратные уравнения · демонстрация'],groups:['Мои группы','Рабочее пространство учителя'],tests:['Мои тесты','Создание, публикация и управление доступом']};
function go(name){screen.value=name;state.value='normal';render();main.focus()}
function demo(){document.querySelector('#feedback').textContent='Это макет: операция не отправляется на сервер.'}
function button(text,action='',primary=false){return `<button ${primary?'class="primary"':''} ${action?`onclick="${action}"`:''}>${text}</button>`}
function nav(){let teacher=['groups','tests'].includes(screen.value);document.querySelector('#role').textContent=teacher?'Учитель':'Ученик';let items=teacher?[['groups','Группы'],['tests','Тесты'],['','Вопросы'],['','Уроки'],['','Профиль']]:[['home','Тесты'],['','Уроки'],['ent','ЕНТ'],['result','Результаты'],['','Профиль']];let html=items.map(([id,title])=>`<button ${id===screen.value?'class="active" aria-current="page"':''} onclick="${id?`go('${id}')`:'demo()'}">${title}</button>`).join('');document.querySelector('#desktopnav').innerHTML=html;document.querySelector('#mobilenav').innerHTML=html}
function header(action=''){return `<header class="pagehead"><div><span class="eyebrow">ENT Ready / ${['groups','tests'].includes(screen.value)?'Учитель':'Ученик'}</span><h1>${data[screen.value][0]}</h1><p class="muted">${data[screen.value][1]}</p></div>${action}</header>`}
function statePanel(){if(state.value==='loading')return `<div class="card" role="status">Загружаем данные…<div class="skel"></div><div class="skel short"></div></div>`;if(state.value==='denied')return `<div class="card empty"><h2>Материал недоступен</h2><p class="muted">Проверьте доступ или вернитесь к списку.</p>${button('К списку',"go('home')")}</div>`;if(state.value==='error'&&screen.value!=='test')return `<div class="card empty" role="alert"><h2>Не удалось загрузить данные</h2><p class="muted">Повторите попытку. Это ошибка запроса, а не пустой список.</p>${button('Повторить',"state.value='normal';render()",true)}</div>`;if(state.value==='empty')return `<div class="card empty"><h2>${screen.value==='home'?'Назначенных тестов пока нет':'Здесь пока нет данных'}</h2><p class="muted">${screen.value==='home'?'Можно выбрать предмет для тренировки.':'Данные появятся после успешного действия.'}</p>${button('Показать пример',"state.value='normal';render()")}</div>`;return ''}
function home(){return header(button('Пробный ЕНТ',"go('ent')"))+`<h2>Назначенные тесты</h2><article class="card row"><div><span class="badge">Назначение</span><h3 style="margin-top:10px">Квадратные уравнения</h3><div class="tagline"><span>До 3 попыток</span><span>20 минут</span></div></div>${button('Открыть тест',"go('test')",true)}</article><div class="section"><h2>Тренировка по предметам</h2><p class="muted">Выберите предмет для самостоятельной подготовки.</p></div><label class="field search">Поиск по загруженным предметам<input id="search" placeholder="Например, математика" oninput="filterSubjects(this.value)"></label><div class="grid" id="subjects">${subjects('')}</div><p id="searchstatus" role="status"></p>`}
const names=['Математика','Физика','История Казахстана','Химия','Биология','Английский язык'];function subjects(q){return names.filter(n=>n.toLowerCase().includes(q.toLowerCase())).map((n,i)=>`<button class="subject" onclick="demo()"><span class="symbol" aria-hidden="true">${['∑','Ф','И','Х','Б','EN'][i]}</span><b>${n}</b></button>`).join('')};function filterSubjects(q){document.querySelector('#subjects').innerHTML=subjects(q);document.querySelector('#searchstatus').innerHTML=document.querySelector('#subjects').children.length?'':'Ничего не найдено. <button onclick="document.querySelector(\'#search\').value=\'\';filterSubjects(\'\')">Сбросить поиск</button>'}
function test(){let s=state.value;let status=s==='expired'?'<div class="notice" role="status">Время вышло. Отправляем результат… (демонстрация, запрос не выполняется)</div>':s==='error'?`<div class="notice bad" role="alert">! Ответ не сохранён. ${button('Повторить',"state.value='saved';render()")}</div>`:s==='pending'?'<div class="notice" role="status">Сохраняем ответ…</div>':s==='saved'?'<div class="notice good" role="status">✓ Ответ сохранён</div>':'<div class="notice">Выберите ответ. Состояние записи переключается в панели ревью.</div>';return `<div class="center">${header()}<div class="row tight"><b>Вопрос 2 из 5</b><span class="badge" style="font-variant-numeric:tabular-nums">Примерно 18:42</span></div><div class="progress" aria-label="Положение: вопрос 2 из 5"><span></span></div><section class="card"><fieldset class="answers"><legend class="question">Найдите корни уравнения<br><b>x² − 5x + 6 = 0</b></legend>${[['A','1 и 6'],['B','2 и 3'],['C','−2 и −3'],['D','0 и 5']].map(([id,t])=>`<label class="option"><input type="radio" name="answer" ${s==='expired'?'disabled':''} value="${id}" ${selected===id?'checked':''} onchange="selected=this.value;state.value='pending';render()"><span><b>${id}.</b> ${t}</span></label>`).join('')}</fieldset>${status}</section><div class="row">${button('Назад','demo()')}<button class="primary" ${s!=='saved'?'disabled':'onclick="demo()"'}>Далее</button></div><p class="muted" style="margin-top:20px;font-size:13px">Локальное состояние может потеряться при выходе или перезагрузке. Восстановление попытки здесь не обещается.</p></div>`}
function result(){let locked=state.value==='locked';return `<div class="center">${header()}<section class="card"><span class="badge">Тест завершён</span><div class="score">8 <span class="muted" style="font-size:24px;font-weight:normal;letter-spacing:0">/ 10 баллов</span></div><p class="muted">80% от максимального балла</p></section>${locked?'<section class="notice"><h2>Разбор пока недоступен</h2><p>Результаты откроются, когда все участники группы сдадут тест.</p><small>Скрытые ответы в этом состоянии не отображаются.</small></section>':`<h2 class="section">Разбор ответов</h2><section class="card"><span class="badge good">✓ Верно</span><h3 style="margin-top:14px">Найдите корни x² − 5x + 6 = 0</h3><div class="notice good">2 и 3 — ваш правильный ответ</div></section><section class="card"><span class="badge bad">× Неверно</span><h3 style="margin-top:14px">Вычислите 3² + 4²</h3><div class="notice bad">7 — ваш ответ</div><div class="notice good">25 — правильный ответ</div></section>`}${button('К результатам','demo()',true)}</div>`}
function groups(){return header(button('Создать группу',"document.querySelector('#groupform').hidden=!document.querySelector('#groupform').hidden",true))+`<section class="card form" id="groupform" hidden><h2>Новая группа</h2><label class="field">Название группы<input placeholder="Математика 10А"></label><div class="grid two"><label class="field">Город<input placeholder="Алматы"></label><label class="field">Школа / организация<input placeholder="Название организации"></label></div><label class="field">Тип группы<select><option>Школа</option><option>Курс</option><option>От нас</option></select></label>${button('Создать · демонстрация','demo()',true)}</section>${['Математика · 10А','Подготовка к ЕНТ · вечерняя группа','Физика · задачи повышенной сложности'].map((g,i)=>`<article class="card row"><div><h3>${g}</h3><p class="muted">${['Алматы · Школа · демо','Астана · Курс · демо','Алматы · Школа · демо'][i]}</p></div>${button('Открыть группу','demo()')}</article>`).join('')}<p class="muted">Показаны только группы. Метрики учеников и активности не добавлены.</p>`}
function ent(){let locked=state.value==='locked';return header()+`<div class="grid two"><section class="card"><h2>Состав пробного теста</h2>${['Математическая грамотность','История Казахстана','Грамотность чтения','Профильный предмет 1','Профильный предмет 2'].map(n=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)">${n}</div>`).join('')}<p class="muted" style="margin-top:16px;font-size:13px">Число вопросов, время и баллы — из подтверждённой конфигурации продукта.</p></section><section class="card"><h2>Профильные предметы</h2>${locked?`<div class="notice">Выберите два профильных предмета в профиле.</div>${button('Выбрать в профиле','demo()',true)}`:'<p>Математика</p><p>Физика</p><div class="divider"></div>'+button('Начать пробный ЕНТ','demo()',true)}<p class="muted" style="margin-top:16px;font-size:13px">Кнопки показывают расположение. Попытка не создаётся.</p></section></div><h2 class="section">История попыток</h2><div class="card row"><div><h3>Математика · Физика</h3><p class="muted">20.10.2026 · искусственный пример</p></div><b>96 / 140 баллов</b></div>`}
function tests(){return header(button('Создать тест',"document.querySelector('#testform').hidden=!document.querySelector('#testform').hidden",true))+`<section class="card form" id="testform" hidden><h2>Новый тест</h2><label class="field">Название<input placeholder="Название теста"></label><div class="grid two"><label class="field">Группа<select><option>Без группы</option><option>Математика · 10А</option></select></label><label class="field">Предмет<select><option>Без предмета</option><option>Математика</option></select></label><label class="field">Максимум попыток<input type="number" value="3" min="1"></label><label class="field">Время, минуты<input type="number" placeholder="Без ограничения"></label></div><label class="field">Дедлайн<input type="datetime-local"></label><label class="option"><input type="checkbox">Публичный доступ</label><small>Публикация и публичный доступ — разные настройки.</small><div class="actions">${button('Создать · демонстрация','demo()',true)}</div></section><label class="field search">Предмет<select onchange="document.querySelector('#liststatus').textContent='Показан демонстрационный список: реальной фильтрации данных нет.'"><option>Все предметы</option><option>Математика</option></select></label><p id="liststatus" role="status"></p><div class="testlist">${[['Квадратные уравнения','Опубликован','Не публичный'],['Тригонометрия: вводная работа','Черновик','Публичный доступ']].map(([title,a,b])=>`<article class="card row"><div><h3>${title}</h3><p><span class="badge">${a}</span><small>${b}</small></p><div class="tagline"><span>До 3 попыток</span><span>20 минут</span></div></div>${button('Редактировать','demo()')}</article>`).join('')}</div>`}
function render(){nav();let panel=statePanel();main.innerHTML=panel?header()+panel:({home,ent,test,result,groups,tests}[screen.value]());main.innerHTML+='<p id="feedback" role="status"></p><p class="state-note">Дизайн-макет · Все имена, задания и результаты искусственные. Визуальная проверка текущего сайта не выполнялась.</p>';main.tabIndex=-1}
screen.onchange=()=>{state.value='normal';render()};state.onchange=render;document.querySelector('#theme').onclick=()=>{let dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';document.querySelector('#theme').textContent=dark?'Светлая тема':'Тёмная тема'};render();
</script></html>
