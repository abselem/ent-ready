# Isolated generation until legacy SQL sources and generated code are reconciled.
# Generate with: sqlc generate -f sqlc.organizations.yaml
version: "2"
sql:
  - engine: "postgresql"
    queries: "db/organization_queries"
    schema: "db/migrations"
    gen:
      go:
        package: "organizationsqlc"
        out: "db/organizationsqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        omit_unused_structs: true
